<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECER27投票后台</title>
<style>
:root{--bg:#050914;--cyan:#24dcff;--blue:#2586ff;--violet:#8d5cff;--text:#eef8ff;--muted:#9fc6e8;--line:rgba(36,220,255,.42);--card:rgba(10,22,45,.86);--card2:rgba(6,13,28,.92)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:radial-gradient(circle at 14% 12%,rgba(36,220,255,.2),transparent 30%),radial-gradient(circle at 88% 82%,rgba(141,92,255,.18),transparent 32%),linear-gradient(135deg,#030711,#07152b 58%,#030711);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(36,220,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(36,220,255,.18) 1px,transparent 1px);background-size:36px 36px}
body:after{content:"";position:fixed;inset:18px;border:1px solid rgba(36,220,255,.35);pointer-events:none;box-shadow:0 0 28px rgba(36,220,255,.12),inset 0 0 28px rgba(36,220,255,.08)}
.wrap{position:relative;width:min(1180px,92vw);margin:0 auto;padding:42px 0 36px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}
.title{font-size:clamp(30px,4.6vw,56px);font-weight:900;letter-spacing:.04em;text-shadow:0 0 26px rgba(36,220,255,.38)}
.timer,.pill{border:1px solid var(--line);border-radius:999px;padding:10px 18px;color:#fff;background:rgba(7,17,36,.78);box-shadow:0 0 18px rgba(36,220,255,.18) inset;white-space:nowrap;font-weight:700}
.question{margin:0 0 26px;padding:26px 30px;border:1px solid rgba(36,220,255,.5);border-radius:24px;background:linear-gradient(135deg,rgba(14,32,64,.72),rgba(6,13,28,.76));box-shadow:0 0 32px rgba(36,220,255,.18),inset 0 0 40px rgba(37,134,255,.08);font-size:clamp(28px,4.3vw,50px);line-height:1.25;font-weight:900}
.option{position:relative;display:grid;grid-template-columns:76px 1fr;gap:18px;align-items:center;margin:16px 0;padding:18px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,var(--card),var(--card2));box-shadow:0 0 26px rgba(36,220,255,.15),inset 0 0 30px rgba(37,134,255,.08);cursor:pointer;transition:.18s ease}
.option:hover{transform:translateY(-2px);border-color:rgba(36,220,255,.96);box-shadow:0 0 38px rgba(36,220,255,.28),inset 0 0 34px rgba(37,134,255,.1)}
.option.selected{border-color:var(--violet);box-shadow:0 0 40px rgba(141,92,255,.38),inset 0 0 36px rgba(141,92,255,.12)}
.badge{width:66px;height:66px;display:grid;place-items:center;border-radius:19px;border:1px solid rgba(36,220,255,.56);background:rgba(36,220,255,.1);font-size:34px;font-weight:900;text-shadow:0 0 18px rgba(36,220,255,.85)}
.opt-text{font-size:clamp(18px,2.45vw,28px);line-height:1.45;font-weight:800}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:start}
.panel{border:1px solid var(--line);border-radius:24px;padding:24px;background:linear-gradient(135deg,rgba(14,32,64,.8),rgba(6,13,28,.9));box-shadow:0 0 30px rgba(36,220,255,.15),inset 0 0 32px rgba(37,134,255,.08)}
.panel h2{margin:0 0 10px;font-size:28px}
.total{color:#bdeeff;font-size:20px;margin:0 0 18px}
.result-row{margin:20px 0}
.row-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:8px}
.r-label{font-size:22px;font-weight:900}
.r-percent{font-size:34px;font-weight:900;text-shadow:0 0 18px rgba(36,220,255,.42)}
.r-count{margin-top:6px;color:var(--muted);font-size:15px}
.bar{height:20px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .28s ease}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
button,a.button{border:1px solid rgba(36,220,255,.56);background:rgba(36,220,255,.1);color:#eaffff;padding:11px 16px;border-radius:999px;cursor:pointer;font-weight:800;font-size:15px;text-decoration:none;display:inline-block}
button:hover,a.button:hover{box-shadow:0 0 20px rgba(36,220,255,.28)}
.footer{margin-top:22px;color:var(--muted);font-size:15px;line-height:1.7}
.qrbox{background:#fff;border-radius:20px;padding:18px;text-align:center;margin-top:18px}
#qrcode canvas,#qrcode img{width:min(300px,100%)!important;height:auto!important}
.linkbox{margin-top:14px;color:#bdeeff;word-break:break-all;font-size:14px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);padding:12px 20px;border:1px solid rgba(36,220,255,.58);border-radius:999px;background:rgba(5,13,29,.92);color:#eaffff;box-shadow:0 0 24px rgba(36,220,255,.2);opacity:0;pointer-events:none;transition:.25s ease;z-index:5}
.toast.show{opacity:1;bottom:42px}
.warn{border:1px solid rgba(255,180,80,.65);background:rgba(255,180,80,.08);border-radius:18px;padding:16px;color:#ffe8c2;line-height:1.65}
@media(max-width:900px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}body:after{inset:8px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title">ECER27投票后台</div>
    <div class="pill" id="sessionText">Session</div>
  </div>

  <div id="configWarn" class="warn" style="display:none"></div>

  <div class="grid">
    <div class="panel">
      <h2>实时投票结果</h2>
      <div class="question" style="font-size:32px;margin-top:18px">合同没有明确写ECER27，买方能否要求卖方按照ECER27承担责任？</div>
      <div class="total" id="total">当前总票数：0</div>
      <div id="resultList"></div>
      <div class="actions">
        <button onclick="resetVotes()">清空本次投票</button>
        <button onclick="copyVoteLink()">复制投票链接</button>
      </div>
      <div class="footer">后台每次有人投票会自动刷新百分比。清空投票需要输入你在firebase-config.js里设置的adminResetCode。</div>
    </div>

    <div class="panel">
      <h2>学生扫码投票</h2>
      <div class="qrbox"><div id="qrcode"></div></div>
      <div class="linkbox" id="voteLink"></div>
      <div class="actions">
        <a class="button" id="openVote" target="_blank">打开学生投票页</a>
      </div>
      <div class="footer">把这个后台页投屏即可。学生扫右侧二维码进入投票页。</div>
    </div>
  </div>
</div>
<div class="toast" id="toast">已复制</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="poll.js"></script>
<script>
initPoll("admin");
</script>
</body>
</html>
